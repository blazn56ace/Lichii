name: Upstream nx2 integration for GLSL HMMA diagnostics

on:
  push:
    branches:
      - experiment/glsl-hmma-upstream-nov06
    paths:
      - .github/workflows/integrate-oot-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glsl-hmma-upstream-nov06
  cancel-in-progress: false

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/glsl-hmma-upstream-nov06
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch upstream nx2 and merge without losing local changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zortos293/Lichii.git
          git fetch --no-tags upstream nx2
          echo "Upstream SHA: $(git rev-parse FETCH_HEAD)"
          echo "Local SHA: $(git rev-parse HEAD)"
          base_commit=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          upstream_commit=$(git rev-parse FETCH_HEAD)
          # Merge into the index and worktree, without making an upstream-parent commit.
          # This avoids importing changes to workflow files in pushed ancestry.
          if ! git merge --no-commit --no-ff "$upstream_commit"; then
            echo "::error::Upstream merge has conflicts; nothing will be pushed."
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # Remove upstream workflow additions and restore existing workflows.
          git restore --source="$base_commit" --staged --worktree -- .github/workflows
          git rm --cached --ignore-unmatch .github/workflows/build-check.yml
          rm -f .github/workflows/build-check.yml
          git add -A
          git diff --cached --name-status "$base_commit" | head -100
          # Commit the resolved source tree as one normal single-parent commit.
          # Never push the temporary upstream merge commit/history.
          merged_tree=$(git write-tree)
          git merge --abort
          git read-tree --reset -u "$merged_tree"
          git commit -m "Integrate upstream nx2 source improvements without workflow changes"
          git push origin HEAD:refs/heads/experiment/glsl-hmma-upstream-nov06
