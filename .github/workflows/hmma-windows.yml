name: Windows x64 HMMA experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hmma-inline-windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtcharts qtmultimedia'
          cache: true
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: true
      - name: Locate glslangValidator
        shell: pwsh
        run: |
          $candidate = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/VULKAN_SDK", "C:/VulkanSDK" -Filter glslangValidator.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candidate) {
            choco install glslang -y --no-progress
            $candidate = Get-ChildItem -Path "C:/ProgramData/chocolatey", "C:/Program Files" -Filter glslangValidator.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candidate) { throw "glslangValidator.exe not found" }
          $bin = $candidate.DirectoryName
          Write-Host "Using glslangValidator from $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GLSLANG_VALIDATOR=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DYUZU_TESTS=OFF -DYUZU_USE_CPM=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4 --target yuzu
      - name: Collect application files
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter lichii.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "lichii.exe not found after build" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') dist -Recurse -Force
          Get-ChildItem dist | Select-Object Name, Length
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-HMMA-Inline-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
